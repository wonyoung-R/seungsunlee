// ============================================================================
// LIGHTBOX MODAL  (ReactDOM.createPortal → body에 직접 마운트)
// ============================================================================
const LightboxModal = ({ data, onClose }) => {
  const [idx, setIdx] = React.useState(0);
  const touchStart = React.useRef(null);
  const thumbStripRef = React.useRef(null);
  const thumbRefs = React.useRef({});
  const { images, title, subtitle, year, link } = data;
  const total = images.length;

  const prev = () => setIdx(i => (i - 1 + total) % total);
  const next = () => setIdx(i => (i + 1) % total);

  React.useEffect(() => {
    const handler = (e) => {
      if (e.key === "Escape")     onClose();
      if (e.key === "ArrowLeft")  prev();
      if (e.key === "ArrowRight") next();
    };
    window.addEventListener("keydown", handler);
    // 스크롤 잠금
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", handler);
      document.body.style.overflow = "";
    };
  }, []);

  // 활성 썸네일 자동 스크롤 (idx 변경 시 가운데로)
  React.useEffect(() => {
    const el = thumbRefs.current[idx];
    if (el && el.scrollIntoView) {
      el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    }
  }, [idx]);

  const onTouchStart = (e) => { touchStart.current = e.touches[0].clientX; };
  const onTouchEnd   = (e) => {
    if (touchStart.current === null) return;
    const dx = e.changedTouches[0].clientX - touchStart.current;
    if (Math.abs(dx) > 44) dx < 0 ? next() : prev();
    touchStart.current = null;
  };

  const navBtn = (side, action, label) => (
    <button onClick={(e) => { e.stopPropagation(); action(); }} aria-label={label}
      style={{
        position: "absolute", top: "50%", transform: "translateY(-50%)",
        [side]: 0,
        background: "rgba(0,0,0,0.35)", border: "none", color: "#FFF",
        width: 52, height: 72, cursor: "pointer",
        fontFamily: "'Inter', sans-serif", fontSize: 22, lineHeight: 1,
        display: "flex", alignItems: "center", justifyContent: "center",
        transition: "background 0.15s",
        // 모바일 터치 영역 충분히
        minWidth: 44, minHeight: 44,
      }}
      onMouseEnter={e => e.currentTarget.style.background = "rgba(0,0,0,0.6)"}
      onMouseLeave={e => e.currentTarget.style.background = "rgba(0,0,0,0.35)"}
    >{label === "이전" ? "‹" : "›"}</button>
  );

  return ReactDOM.createPortal(
    <div
      style={{
        position: "fixed", inset: 0, zIndex: 99999,
        background: "rgba(0,0,0,0.94)",
        display: "flex", flexDirection: "column",
        WebkitTapHighlightColor: "transparent",
      }}
      onClick={onClose}
      onTouchStart={onTouchStart}
      onTouchEnd={onTouchEnd}
    >
      {/* ── 헤더 ── */}
      <div onClick={e => e.stopPropagation()} style={{
        display: "flex", alignItems: "center", justifyContent: "space-between",
        padding: "env(safe-area-inset-top, 0px) 20px 0",
        paddingTop: "max(env(safe-area-inset-top), 16px)",
        paddingBottom: 12,
        flexShrink: 0,
      }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
          <div style={{
            fontFamily: "'Cormorant Garamond', serif",
            fontSize: "clamp(14px, 1.1vw, 18px)", color: "#FFFFFF", fontWeight: 400,
          }}>{title}</div>
          {subtitle && (
            <div style={{
              fontFamily: "'Inter', sans-serif",
              fontSize: 11, color: "rgba(255,255,255,0.55)", letterSpacing: 0.3,
            }}>{subtitle}</div>
          )}
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 16, flexShrink: 0 }}>
          {total > 1 && (
            <div style={{
              fontFamily: "'JetBrains Mono', monospace",
              fontSize: 11, color: "rgba(255,255,255,0.55)", letterSpacing: 1.5,
            }}>{idx + 1} / {total}</div>
          )}
          <button onClick={(e) => { e.stopPropagation(); onClose(); }}
            style={{
              background: "rgba(255,255,255,0.12)", border: "1px solid rgba(255,255,255,0.2)",
              color: "#FFF", width: 36, height: 36, borderRadius: "50%",
              cursor: "pointer", fontSize: 16, display: "flex",
              alignItems: "center", justifyContent: "center", flexShrink: 0,
            }}>✕</button>
        </div>
      </div>

      {/* ── 이미지 ── */}
      <div onClick={e => e.stopPropagation()} style={{
        flex: 1, minHeight: 0, position: "relative",
        display: "flex", alignItems: "center", justifyContent: "center",
        overflow: "hidden",
      }}>
        <img
          key={idx}
          src={images[idx].url}
          alt={images[idx].caption || title}
          style={{
            maxWidth: "100%", maxHeight: "100%",
            objectFit: "contain", display: "block",
            userSelect: "none", WebkitUserDrag: "none",
            animation: "lbFadeIn 180ms ease",
          }}
        />
        {total > 1 && <>
          {navBtn("left",  prev, "이전")}
          {navBtn("right", next, "다음")}
        </>}
      </div>

      {/* ── 푸터 ── */}
      <div onClick={e => e.stopPropagation()} style={{
        flexShrink: 0,
        padding: "12px 20px",
        paddingBottom: "max(env(safe-area-inset-bottom), 20px)",
        display: "flex", flexDirection: "column", gap: 12, alignItems: "center",
      }}>
        {/* 캡션 */}
        {images[idx].caption && (
          <div style={{
            fontFamily: "'Inter', 'Noto Sans KR', sans-serif",
            fontSize: 12, color: "rgba(255,255,255,0.65)",
            textAlign: "center", letterSpacing: 0.3,
          }}>{images[idx].caption}</div>
        )}

        {/* 썸네일 스트립 (PPT 스타일 — 하단에 가로로 쭉) */}
        {total > 1 && (
          <div
            ref={thumbStripRef}
            style={{
              display: "flex", gap: 8, alignItems: "center",
              width: "100%", maxWidth: 1200,
              overflowX: "auto", overflowY: "hidden",
              padding: "4px 8px 8px",
              scrollbarWidth: "thin",
              scrollbarColor: "rgba(255,255,255,0.25) transparent",
              WebkitOverflowScrolling: "touch",
              justifyContent: total <= 8 ? "center" : "flex-start",
            }}
            className="lb-thumb-strip"
          >
            {images.map((im, i) => (
              <button key={i}
                ref={el => { thumbRefs.current[i] = el; }}
                onClick={() => setIdx(i)}
                aria-label={`${i + 1}번 사진`}
                aria-current={i === idx ? "true" : "false"}
                style={{
                  flexShrink: 0,
                  width: "clamp(48px, 7vw, 72px)",
                  height: "clamp(48px, 7vw, 72px)",

                  cursor: "pointer",
                  opacity: i === idx ? 1 : 0.55,
                  transition: "opacity 0.18s, border-color 0.18s",
                  position: "relative",
                  overflow: "hidden",
                }}
                onMouseEnter={e => { if (i !== idx) e.currentTarget.style.opacity = "0.85"; }}
                onMouseLeave={e => { if (i !== idx) e.currentTarget.style.opacity = "0.55"; }}
              >
                <img src={im.url} alt=""
                  style={{
                    width: "100%", height: "100%",
                    objectFit: "cover", display: "block",
                    pointerEvents: "none", userSelect: "none",

              </button>
            ))}
          </div>
        )}

        {/* 링크 */}
        {link && (
          <a href={link} target="_blank" rel="noopener noreferrer"
            onClick={e => e.stopPropagation()}
            style={{
              fontFamily: "'JetBrains Mono', monospace",

// ── 인라인 확장 패널 (라이트박스 대체) ─────────────────────────────────────
// 그리드 안의 카드 자리에서 grid-column 1/-1 로 펼쳐지는 인라인 갤러리.
// 사진은 풀너비 세로 한 줄로 쭉 나열 (PPT 한 슬라이드씩 보는 형태).
const ExpandedPanel = ({ item, onClose }) => {
  const { imgs, title, subtitle, body, year, link } = item;
  const containerRef = React.useRef(null);

  // ESC 키로 닫기
  React.useEffect(() => {
    const handler = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [onClose]);

  // 마운트 시 자기 자신을 viewport 상단으로 부드럽게 스크롤
  React.useEffect(() => {
    if (containerRef.current && containerRef.current.scrollIntoView) {
      containerRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }, []);

  return (
    <div ref={containerRef}
         onClick={(e) => e.stopPropagation()}
         style={{
           gridColumn: "1 / -1",
           background: "#FFFFFF",
           border: "1px solid #EBEBEB",
           position: "relative",
           animation: "expandIn 280ms cubic-bezier(0.22, 0.61, 0.36, 1)",
           transformOrigin: "top center",
         }}>
      {/* sticky 닫기 헤더 (스크롤해도 항상 보임) */}
      <div style={{
        position: "sticky", top: 0, zIndex: 10,
        display: "flex", justifyContent: "flex-end",
        padding: 14,
        background: "linear-gradient(to bottom, rgba(255,255,255,0.96) 60%, rgba(255,255,255,0))",
        pointerEvents: "none",
      }}>
        <button onClick={onClose} aria-label="닫기"
          style={{
            pointerEvents: "auto",
            background: "rgba(255,255,255,0.96)", border: "1px solid #DDD",
            color: "#1A1814", width: 36, height: 36, borderRadius: "50%",
            cursor: "pointer", fontSize: 16, lineHeight: 1,
            display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: "0 2px 8px rgba(0,0,0,0.06)",
          }}>✕</button>
      </div>

      {/* 사진 세로 스택 — PPT 한 슬라이드씩 풀너비로 쭉 */}
      <div style={{ display: "flex", flexDirection: "column", gap: 16, padding: "0 24px", marginTop: -36 }}>
        {imgs.map((im, i) => (
          <figure key={i} style={{ margin: 0, width: "100%", background: "#F4F4F4" }}>
            <img src={im.url} alt={`${title} — ${i + 1}`}
              loading={i === 0 ? "eager" : "lazy"}
              style={{
                width: "100%", height: "auto",
                display: "block",
                userSelect: "none", WebkitUserDrag: "none",
              }} />
            {im.caption && (
              <figcaption style={{
                fontFamily: "'Inter', 'Noto Sans KR', sans-serif",
                fontSize: 12, color: "#7A7466",
                padding: "8px 4px 0", lineHeight: 1.5,
              }}>{im.caption}</figcaption>
            )}
          </figure>
        ))}
      </div>

      {/* 텍스트 */}
      <div style={{ padding: "24px 24px 32px", maxWidth: 880 }}>
        <h3 style={{
          fontFamily: "'Cormorant Garamond', 'Noto Serif KR', serif",
          fontWeight: 400, fontSize: "clamp(20px, 1.6vw, 28px)",
          color: "#1A1814", margin: 0, lineHeight: 1.25,
        }}>{title}</h3>
        {subtitle && (

            fontFamily: "'Cormorant Garamond', serif",
            fontWeight: 400, fontSize: titleSize,
            lineHeight: 1.05, color: "#1A1814", margin: "12px 0 8px",
          }}>Connect</h2>
          <p style={{
            margin: "0 0 32px",
            fontFamily: "'Cormorant Garamond', serif", fontStyle: "italic",
            fontSize: "clamp(14px, 3.8vw, 17px)", color: "#5A5448", lineHeight: 1.55,
          }}>A curatorial gaze between art and people</p>

          {/* 연락처 아이템 */}
          <div style={{ display: "flex", flexDirection: "column" }}>
            {CONTACTS.map(([k, v, href], i) => (
              <a key={i} href={href}
                target={href.startsWith("mailto:") ? undefined : "_blank"} rel="noopener noreferrer"
                onClick={(e) => e.stopPropagation()}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                  borderTop: "1px solid rgba(26,24,20,0.1)",
                  padding: "20px 0", minHeight: 76,
                  textDecoration: "none", color: "inherit",
                }}>
                <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                  <span style={{
                    fontFamily: "'JetBrains Mono', monospace",
                    fontSize: 10, color: "#9A9486", letterSpacing: 1.8, textTransform: "uppercase",
                  }}>{k}</span>
                  <span style={{
                    fontFamily: "'Inter', sans-serif",
                    fontSize: "clamp(14px, 3.8vw, 16px)", color: "#1A1814",
                  }}>{v}</span>
                </div>
                <span style={{
                  fontFamily: "'Inter', sans-serif",
                  fontSize: 20, color: "#BCBAB4", flexShrink: 0, marginLeft: 16,
                }}>→</span>
              </a>
            ))}
          </div>
        </div>

        {/* 하단 카피라이트 */}
        <div style={{
          padding: "14px 7vw",
          paddingBottom: "max(env(safe-area-inset-bottom, 0px), 20px)",
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 9, color: "#C0BCB5", letterSpacing: 1.5, flexShrink: 0,
        }}>© SEUNGSUN LEE · ALL RIGHTS RESERVED</div>
      </div>
    );
  }

  // ── 데스크탑 레이아웃 (또는 그리드 썸네일) ──────────────────────────────
  return (
    <div style={{ height: "100%", display: "flex", background: "#FFFFFF" }}>
      {/* Left — hero contact image */}
      <div style={{ flex: 1, position: "relative", overflow: "hidden" }}>
        <Photo tone={3} ratio="auto" style={{ position: "absolute", inset: 0, aspectRatio: "auto" }}
               src="assets/img/hero-contact.webp"
               alt="Connect — Seungsun Lee"
               objectPosition="center center" />
      </div>

      {/* Right — text panel */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", background: "#FFFFFF" }}>
        <MiniNav label="Connect" active="contact" onGo={onGo} dense={dense} />
        <div style={{
          flex: 1, padding: focused ? "8vh 7vw" : "5% 6%",
          display: "flex", flexDirection: "column",
          justifyContent: "space-between", gap: focused ? 40 : 12,
        }}>
          <div>
            <h2 style={{
              fontFamily: "'Cormorant Garamond', serif",
              fontWeight: 400, fontSize: titleSize,
              lineHeight: 1.05, color: "#1A1814", margin: 0,
            }}>Connect</h2>
            {focused && (
              <div style={{ marginTop: 20, display: "flex", flexDirection: "column", gap: 4 }}>
                <p style={{
                  margin: 0,
                  fontFamily: "'Cormorant Garamond', serif", fontStyle: "italic",
                  fontSize: "clamp(14px, 1vw, 17px)", color: "#5A5448", lineHeight: 1.5,
                }}>A curatorial gaze between art and people</p>
                <p style={{
                  margin: 0,
                  fontFamily: "'Noto Sans KR', sans-serif",
                  fontSize: "clamp(13px, 0.85vw, 15px)", color: "#9A9486", lineHeight: 1.6,
                }}>예술과 사람 사이의 시선을 만듭니다.</p>
              </div>
            )}
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: focused ? 0 : 6 }}>
            {CONTACTS.map(([k, v, href], i) => (
              <a key={i} href={href}
                target={href.startsWith("mailto:") ? undefined : "_blank"} rel="noopener noreferrer"
                onClick={(e) => e.stopPropagation()}
                style={{
                  display: "flex", flexDirection: "column", gap: focused ? 5 : 1,
                  borderTop: "1px solid rgba(26,24,20,0.12)",
                  paddingTop: focused ? 16 : 3, paddingBottom: focused ? 16 : 3,
                  minHeight: focused ? 60 : "auto",
                  textDecoration: "none", color: "inherit", justifyContent: "center",
                }}>
                <span style={{
                  fontFamily: "'JetBrains Mono', monospace",
                  fontSize: labelSize, color: "#9A9486", letterSpacing: 1.5, textTransform: "uppercase",
                }}>{k}</span>
                <span style={{ fontSize: bodySize, color: "#1A1814" }}>{v} →</span>
              </a>
            ))}
          </div>
        </div>
        <div style={{
          padding: focused ? "20px 7vw" : "8px 6%",
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: focused ? 10 : 7, color: "#9A9486", letterSpacing: 1.5,
        }}>© SEUNGSUN LEE · ALL RIGHTS RESERVED</div>
      </div>
    </div>
  );
};

// ============================================================================
// REGISTRY · GRID · APP
// ============================================================================

const SLIDE_REGISTRY = {
  home:      SlideHome,
  about:     SlideAbout,
  portfolio: SlidePortfolio,
  projects:  SlideProjects,
  docent:    SlideDocent,
  lecture:   SlideLecture,
  talk:      SlideTalk,
  contact:   SlideContact,
};

const GRID_LAYOUT = [
  { key: "home",      area: "1 / 1 / 2 / 3", aspect: "16/9"  },
  { key: "about",     area: "2 / 1 / 3 / 2", aspect: "16/10" },
  { key: "portfolio", area: "2 / 2 / 3 / 3", aspect: "16/10" },
  { key: "contact",   area: "3 / 1 / 4 / 3", aspect: "21/9"  },
];

const NAV_TO_SLIDE = {
  home: "home", about: "about", portfolio: "portfolio",
  projects: "projects", docent: "docent", lecture: "lecture",
  talk: "talk", contact: "contact",
};

const App = () => {
  const [focused, setFocused] = React.useState(null);
  const cardRefs = React.useRef({});
  const [transition, setTransition] = React.useState(null);
  const [landed, setLanded] = React.useState(false);
  const [sigLectures, setSigLectures] = React.useState([]);
  const [talks, setTalks] = React.useState([]);
  const [curations, setCurations] = React.useState([]);
  const [docents, setDocents] = React.useState([]);

  React.useEffect(() => {
    const sb = window.supabase.createClient(SB_URL, SB_KEY);
    const fetchCat = (category, setter) => sb.from('works').select('*')
      .eq('category', category)
      .is('deleted_at', null)
      .order('sort_order')
      .then(({ data }) => { if (data) setter(data); });
    const fetchAll = () => {
      fetchCat('signature_lecture', setSigLectures);
      fetchCat('talk', setTalks);
      fetchCat('curation', setCurations);
      fetchCat('docent', setDocents);
    };

    fetchAll();

    // A. Supabase Realtime — admin 변경 시 자동 push
    const channel = sb.channel('works-public')
      .on('postgres_changes',
          { event: '*', schema: 'public', table: 'works' },
          () => fetchAll())
      .subscribe();

    // B. 탭 포커스 복귀 시 재fetch (Realtime 단절 대비 안전망)
    const onFocus = () => fetchAll();
    window.addEventListener('focus', onFocus);

    return () => {
      sb.removeChannel(channel);
      window.removeEventListener('focus', onFocus);
    };
  }, []);

  const openSlide = (key) => {
    if (transition) return;
    if (focused === key) return;
    const el = cardRefs.current[key];
    const fromRect = el ? el.getBoundingClientRect() : null;
    setTransition({ key, fromRect, phase: "opening" });
    setFocused(key);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => setTransition(t => t ? { ...t, phase: "open" } : null));
    });
    setTimeout(() => setTransition(null), 700);
  };

  const closeSlide = () => {
    if (!focused) return;
    const key = focused;
    const el = cardRefs.current[key];
    const toRect = el ? el.getBoundingClientRect() : null;
    setTransition({ key, fromRect: toRect, phase: "closing" });
    setTimeout(() => {
      setFocused(null);
      setTransition(null);
    }, 600);
  };

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.key === "Escape") closeSlide();
      if (focused && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
        const order = GRID_LAYOUT.map(g => g.key);
        const i = order.indexOf(focused);
        const next = e.key === "ArrowRight" ? order[(i + 1) % order.length] : order[(i - 1 + order.length) % order.length];
        closeSlide();
        setTimeout(() => openSlide(next), 620);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [focused]);

  const handleNav = (navKey) => {
    const slideKey = NAV_TO_SLIDE[navKey] || navKey;
    if (focused) {
      closeSlide();
      setTimeout(() => openSlide(slideKey), 620);
    } else {
      openSlide(slideKey);
    }
  };

  const handleNavLanding = (navKey) => {
    setLanded(true);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const slideKey = NAV_TO_SLIDE[navKey] || navKey;
        if (slideKey === "home") return;
        openSlide(slideKey);
      });
    });
  };

  if (!landed) {
    return (
      <SigLectureCtx.Provider value={sigLectures}>
      <TalkCtx.Provider value={talks}>
      <CurationCtx.Provider value={curations}>
      <DocentCtx.Provider value={docents}>
      <div style={{
        height: "100vh", width: "100vw", overflow: "hidden",
        background: "#F5F5F5", padding: "clamp(16px, 2.5vw, 36px)",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <div
          onClick={() => setLanded(true)}
          style={{
            width: "100%", height: "100%",
            maxWidth: 1480,
            background: "#FFFFFF",
            cursor: "pointer", overflow: "hidden",
            boxShadow: "0 1px 0 rgba(0,0,0,0.04)",
            animation: "landingFade 1200ms cubic-bezier(0.22,0.61,0.36,1)",
          }}
        >
          <SLIDE_REGISTRY.home onGo={handleNavLanding} dense={false} focused={true} />
        </div>
        <style>{`
          @keyframes landingFade {
            from { opacity: 0; transform: scale(0.985); }
            to { opacity: 1; transform: scale(1); }
          }
        `}</style>
      </div>
      </DocentCtx.Provider>
      </CurationCtx.Provider>
      </TalkCtx.Provider>
      </SigLectureCtx.Provider>
    );
  }

  return (
    <SigLectureCtx.Provider value={sigLectures}>
    <TalkCtx.Provider value={talks}>
    <CurationCtx.Provider value={curations}>
    <DocentCtx.Provider value={docents}>
      <div style={{ minHeight: "100vh", background: "#F5F5F5", padding: "clamp(16px, 2.5vw, 36px)" }}>
        <Grid cardRefs={cardRefs} onOpen={openSlide} onNav={handleNav} focusedKey={focused} />
        <FocusOverlay focused={focused} transition={transition} onClose={closeSlide} onNav={handleNav} />
      </div>
    </DocentCtx.Provider>
    </CurationCtx.Provider>
    </TalkCtx.Provider>
    </SigLectureCtx.Provider>
  );
};

const Grid = ({ cardRefs, onOpen, onNav, focusedKey }) => {
  return (
    <div style={{
      display: "grid",
      gridTemplateColumns: "1fr 1fr",
      gap: "clamp(8px, 1vw, 14px)",
      maxWidth: 1480, margin: "0 auto",
    }} data-grid>
      {GRID_LAYOUT.map(({ key, area, aspect }) => {
        const Slide = SLIDE_REGISTRY[key];
        const isHidden = focusedKey === key;
        return (
          <div
            key={key}
            ref={(el) => { cardRefs.current[key] = el; }}
            onClick={() => onOpen(key)}
            style={{
              gridArea: area,
              aspectRatio: aspect,
              background: "#FFFFFF",
              cursor: "pointer", overflow: "hidden",
              boxShadow: "0 1px 0 rgba(0,0,0,0.04)",
              opacity: isHidden ? 0 : 1,
              transition: "opacity 280ms ease 280ms, transform 600ms cubic-bezier(0.22,0.61,0.36,1)",
              transform: isHidden ? "scale(0.98)" : "scale(1)",
              position: "relative",
            }}
            onMouseEnter={(e) => { if (!isHidden) e.currentTarget.style.transform = "scale(1.005)"; }}
            onMouseLeave={(e) => { if (!isHidden) e.currentTarget.style.transform = "scale(1)"; }}
          >
            <Slide onGo={(navKey) => { onNav(navKey); }} dense focused={false} />
          </div>
        );
      })}
    </div>
  );
};

const FocusOverlay = ({ focused, transition, onClose, onNav }) => {
  if (!focused && !transition) return null;
  const key = focused || transition?.key;
  const Slide = SLIDE_REGISTRY[key];
  const phase = transition?.phase;
  const fromRect = transition?.fromRect;

  const overlayStyle = (() => {
    const target = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight };
    if (phase === "opening" && fromRect) {
      const sx = fromRect.width / target.w;
      const sy = fromRect.height / target.h;
      const tx = fromRect.left;
      const ty = fromRect.top;
      return {
        transform: `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})`,
        transformOrigin: "top left",
        transition: "none",
      };
    }
    if (phase === "closing" && fromRect) {
      const sx = fromRect.width / target.w;
      const sy = fromRect.height / target.h;
      const tx = fromRect.left;
      const ty = fromRect.top;
      return {
        transform: `translate(${tx}px, ${ty}px) scale(${sx}, ${sy})`,
        transformOrigin: "top left",
        transition: "transform 600ms cubic-bezier(0.22,0.61,0.36,1), opacity 400ms ease 250ms",
        opacity: 0,
      };
    }
    return {
      transform: "translate(0, 0) scale(1, 1)",
      transformOrigin: "top left",
      transition: "transform 700ms cubic-bezier(0.22,0.61,0.36,1)",
    };
  })();

  return (
    <>
      <div onClick={onClose}
        style={{
          position: "fixed", inset: 0, background: "#1A1814",
          opacity: phase === "open" ? 0.4 : 0,
          transition: "opacity 600ms ease",
          zIndex: 90,
        }} />
      <div style={{ position: "fixed", inset: 0, zIndex: 100, pointerEvents: "auto", ...overlayStyle }}>
        <div style={{
          width: "100vw", height: "100vh",
          background: "#FFFFFF", overflow: "hidden", position: "relative",
        }}>
          <Slide onGo={(navKey) => onNav(navKey)} dense={false} focused={true} />
          <button onClick={onClose}
            style={{
              position: "absolute", top: 22, right: 24,
              background: "rgba(255,255,255,0.85)", border: "1px solid #1A1814",
              width: 36, height: 36, borderRadius: "50%",
              cursor: "pointer", padding: 0,
              display: "flex", alignItems: "center", justifyContent: "center",
              fontFamily: "'Inter', sans-serif", fontSize: 14, color: "#1A1814",
              opacity: phase === "open" ? 1 : 0,
              transition: "opacity 400ms ease 300ms",
              zIndex: 10,
            }} aria-label="Close">×</button>
          <div style={{
            position: "absolute", left: 24, bottom: 18,
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 10, color: "#9A9486", letterSpacing: 1.5,
            opacity: phase === "open" ? 1 : 0,
            transition: "opacity 400ms ease 300ms",
            background: "rgba(255,255,255,0.85)", padding: "4px 10px",
          }}>
            {String(GRID_LAYOUT.findIndex(g => g.key === key) + 1).padStart(2, "0")} / {String(GRID_LAYOUT.length).padStart(2, "0")} · ESC
          </div>
        </div>
      </div>
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
