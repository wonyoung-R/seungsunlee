<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Seungsun Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', 'Noto Sans KR', sans-serif;
  background: #F5F5F5;
  color: #111;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: 14px; }

/* ── LAYOUT ── */
.app   { display: none; min-height: 100vh; }
.app.visible { display: flex; flex-direction: column; }
.login { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

/* ── LOGIN ── */
.login-box {
  background: #FFF;
  border: 1px solid #E2E2E2;
  padding: 48px 44px;
  width: 380px;
}
.login-title { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
.login-sub   { color: #888; font-size: 12px; margin-bottom: 36px; }
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.field label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
.field input {
  border: 1px solid #E2E2E2;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.2s;
  background: #FAFAFA;
}
.field input:focus { border-color: #111; background: #FFF; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 11px 22px;
  border: 1px solid #111;
  background: #111;
  color: #FFF;
  font-size: 11px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 0.2s;
}
.btn:hover   { opacity: 0.75; }
.btn.full    { width: 100%; margin-top: 8px; }
.btn.ghost   { background: #FFF; color: #111; }
.btn.danger  { background: #FFF; color: #CC3333; border-color: #CC3333; }
.btn.small   { padding: 7px 14px; font-size: 10px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.error-msg { color: #CC3333; font-size: 12px; margin-top: 12px; min-height: 18px; }

/* ── TOP BAR ── */
.topbar {
  height: 60px;
  background: #FFF;
  border-bottom: 1px solid #E2E2E2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 36px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-title { font-size: 13px; font-weight: 500; letter-spacing: 0.03em; }
.topbar-right { display: flex; align-items: center; gap: 20px; }
.topbar-user  { font-size: 11px; color: #888; }

/* ── MAIN ── */
.main { padding: 40px 36px 80px; max-width: 1100px; margin: 0 auto; }

/* ── CARD ── */
.card {
  background: #FFF;
  border: 1px solid #E2E2E2;
  padding: 32px 36px;
  margin-bottom: 32px;
}
.card-title {
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid #EBEBEB;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px 24px;
}
.form-grid .span2 { grid-column: 1 / -1; }
.form-field { display: flex; flex-direction: column; gap: 7px; }
.form-field label { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: #888; }
.form-field input,
.form-field select,
.form-field textarea {
  border: 1px solid #E2E2E2;
  padding: 10px 14px;
  outline: none;
  background: #FAFAFA;
  transition: border-color 0.2s;
  width: 100%;
}
.form-field input:focus,
.form-field select:focus,
.form-field textarea:focus { border-color: #111; background: #FFF; }
.form-field textarea { resize: vertical; min-height: 70px; }
.form-actions {
  margin-top: 24px;
  display: flex;
  gap: 12px;
  align-items: center;
}
.form-msg { font-size: 12px; color: #888; }
.form-msg.ok  { color: #228B22; }
.form-msg.err { color: #CC3333; }

/* ── IMAGE UPLOAD ZONE ── */
.upload-zone {
  border: 2px dashed #D8D2C2;
  background: #FAFAF7;
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  position: relative;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.upload-zone:hover,
.upload-zone.drag-over { border-color: #111; background: #F5F2EB; }
.upload-zone input[type="file"] {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  opacity: 0; cursor: pointer;
  border: none; background: none; padding: 0;
}
.upload-icon { font-size: 28px; line-height: 1; color: #C8C2B2; }
.upload-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: #9A9486; }
.upload-hint  { font-size: 11px; color: #B0A998; }

.upload-preview {
  display: none;
  position: relative;
  width: 100%;
}
.upload-preview img {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  display: block;
}
.upload-preview-remove {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(0,0,0,0.55);
  color: #FFF;
  border: none;
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}
.upload-progress {
  display: none;
  margin-top: 8px;
  font-size: 11px;
  color: #888;
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ── TABLE ── */
.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.table-header h2 { font-size: 15px; font-weight: 500; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn {
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  padding: 6px 14px;
  border: 1px solid #E2E2E2;
  background: #FFF;
  color: #888;
  cursor: pointer;
  transition: 0.2s;
}
.filter-btn:hover  { border-color: #111; color: #111; }
.filter-btn.active { border-color: #111; background: #111; color: #FFF; }
table { width: 100%; border-collapse: collapse; background: #FFF; border: 1px solid #E2E2E2; }
th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: #888;
  padding: 14px 18px;
  border-bottom: 1px solid #E2E2E2;
  font-weight: 500;
  background: #FAFAFA;
}
td {
  padding: 14px 18px;
  border-bottom: 1px solid #F0F0F0;
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: #FAFAFA; }
.td-thumb {
  width: 56px;
  height: 42px;
  object-fit: cover;
  background: #EBEBEB;
  flex-shrink: 0;
  display: block;
}
.td-thumb-empty {
  width: 56px; height: 42px;
  background: #EBEBEB;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #CCC;
}
.badge {
  display: inline-block;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 3px 8px;
  border: 1px solid #E2E2E2;
  color: #777;
}
.table-actions { display: flex; gap: 8px; }
.loading-row td { text-align: center; color: #AAA; padding: 48px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }

/* ── EDIT ROW ── */
.edit-row td { background: #FFFDF7; }
.edit-input {
  border: 1px solid #E2E2E2;
  padding: 6px 10px;
  font-size: 13px;
  width: 100%;
  outline: none;
  background: #FFF;
}
.edit-input:focus { border-color: #111; }
.edit-img-preview {
  width: 80px; height: 60px;
  object-fit: cover;
  display: block;
  margin-bottom: 8px;
  border: 1px solid #E2E2E2;
}
.edit-upload-btn {
  font-size: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  padding: 6px 12px;
  border: 1px solid #D8D2C2;
  background: #FAFAF7;
  cursor: pointer;
  color: #5A5448;
  transition: border-color 0.2s;
}
.edit-upload-btn:hover { border-color: #111; }
.edit-upload-input { display: none; }

/* ── RESPONSIVE ── */
@media (max-width: 700px) {
  .topbar { padding: 0 20px; }
  .main   { padding: 24px 16px 60px; }
  .card   { padding: 24px 20px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span2 { grid-column: 1; }
  th:nth-child(4), td:nth-child(4),
  th:nth-child(5), td:nth-child(5) { display: none; }
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div class="login" id="loginView">
  <div class="login-box">
    <p class="login-title">Seungsun Lee</p>
    <p class="login-sub">관리자 로그인</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPw" placeholder="••••••••" />
    </div>
    <button class="btn full" id="loginBtn">로그인</button>
    <p class="error-msg" id="loginErr"></p>
  </div>
</div>

<!-- ── APP ── -->
<div class="app" id="appView">

  <div class="topbar">
    <span class="topbar-title">Seungsun Lee — Admin</span>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <button class="btn ghost small" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="main">

    <!-- ── ADD FORM ── -->
    <div class="card">
      <p class="card-title">새 이력 추가</p>
      <form id="addForm" autocomplete="off">
        <div class="form-grid">

          <div class="form-field">
            <label>카테고리 *</label>
            <select id="fCat" required>
              <option value="">선택하세요</option>
              <option value="curation">Curation / Project</option>
              <option value="docent">Docent</option>
              <option value="lecture">Lecture (기업 강연)</option>
              <option value="signature_lecture">Signature Lecture</option>
              <option value="talk">Talk</option>
            </select>
          </div>

          <div class="form-field">
            <label>연도</label>
            <input type="number" id="fYear" placeholder="예: 2025" min="2000" max="2099" />
          </div>

          <div class="form-field span2">
            <label>제목 *</label>
            <input type="text" id="fTitle" placeholder="예: SFMOMA" required />
          </div>

          <div class="form-field span2">
            <label>부제목</label>
            <input type="text" id="fSub" placeholder="예: Art Tour Director & Docent" />
          </div>

          <div class="form-field span2">
            <label>설명 (선택)</label>
            <textarea id="fDesc" placeholder="간단한 설명을 입력하세요"></textarea>
          </div>

          <div class="form-field span2">
            <label>링크 (선택)</label>
            <input type="url" id="fLink" placeholder="https://..." />
          </div>

          <!-- 다중 이미지 업로드 -->
          <div class="form-field span2">
            <label>이미지 <span id="imgCount" style="font-weight:400;color:#B0A998">(0 / 20)</span></label>
            <div class="upload-zone" id="uploadZone">
              <input type="file" id="fImgFile" accept="image/*" multiple />
              <div class="upload-icon">↑</div>
              <div class="upload-label">클릭하거나 이미지를 드래그하세요</div>
              <div class="upload-hint">JPG · PNG · WEBP · GIF · 최대 20장</div>
            </div>
            <div id="multiPreviewGrid" style="display:none;margin-top:12px;display:none;grid-template-columns:repeat(4,1fr);gap:8px"></div>
            <div class="upload-progress" id="uploadProgress">업로드 중...</div>
          </div>

        </div>
        <div class="form-actions">
          <button type="submit" class="btn" id="addBtn">추가하기</button>
          <span class="form-msg" id="addMsg"></span>
        </div>
      </form>
    </div>

    <!-- ── TABLE ── -->
    <div class="table-header">
      <h2 id="tableTitle">전체 이력</h2>
      <div class="filter-row">
        <button class="filter-btn active" data-cat="all">전체</button>
        <button class="filter-btn" data-cat="curation">Curation</button>
        <button class="filter-btn" data-cat="docent">Docent</button>
        <button class="filter-btn" data-cat="lecture">Lecture</button>
        <button class="filter-btn" data-cat="signature_lecture">Signature Lecture</button>
        <button class="filter-btn" data-cat="talk">Talk</button>
        <button class="filter-btn" id="trashToggleBtn" style="margin-left:12px">🗑 삭제된 항목</button>
      </div>
    </div>

    <table id="worksTable">
      <thead>
        <tr>
          <th style="width:70px">이미지</th>
          <th>제목</th>
          <th style="width:120px">카테고리</th>
          <th style="width:72px">연도</th>
          <th>부제목</th>
          <th style="width:160px">관리</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="loading-row"><td colspan="6">불러오는 중...</td></tr>
      </tbody>
    </table>

  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// ── CONFIG ────────────────────────────────────────────
const SUPABASE_URL = 'https://khefqzmssgwbztgvrbte.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoZWZxem1zc2d3Ynp0Z3ZyYnRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNjI3NDksImV4cCI6MjA5MzYzODc0OX0.uQGjtnZMQhOCykj-X0Bb0bFlOuE1cup8cKJeWL35fm8';
const BUCKET = 'work-images';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CAT_KR = { curation: 'Curation', docent: 'Docent', lecture: 'Lecture', signature_lecture: 'Signature Lecture', talk: 'Talk' };
let allWorks    = [];
let filterCat   = 'all';
let showDeleted = false;   // false: 활성만, true: 삭제됨만
let editingId   = null;
let pendingFiles = []; // {file, caption, previewUrl}[]

// ── AUTH ──────────────────────────────────────────────
async function checkSession() {
  const { data: { session } } = await db.auth.getSession();
  if (session) showApp(session.user.email);
}

async function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value;
  document.getElementById('loginBtn').disabled = true;
  document.getElementById('loginErr').textContent = '';

  const { data, error } = await db.auth.signInWithPassword({ email, password: pw });
  document.getElementById('loginBtn').disabled = false;

  if (error) {
    document.getElementById('loginErr').textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
    return;
  }
  showApp(data.user.email);
}

async function logout() {
  await db.auth.signOut();
  document.getElementById('appView').classList.remove('visible');
  document.getElementById('loginView').style.display = 'flex';
  document.getElementById('loginPw').value = '';
}

function showApp(email) {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').classList.add('visible');
  document.getElementById('userEmail').textContent = email;
  loadWorks();
}

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('logoutBtn').addEventListener('click', logout);

// ── STORAGE — 카테고리/폴더 구조 업로드 ─────────────
async function uploadToStorage(file, category) {
  const ext    = file.name.split('.').pop().toLowerCase();
  const name   = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const folder = category || 'general';
  const path   = `${folder}/${name}`;

  const { error } = await db.storage.from(BUCKET).upload(path, file, {
    cacheControl: '3600',
    upsert: false,
    contentType: file.type,
  });

  if (error) throw new Error(error.message);

  const { data } = db.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

// ── 다중 이미지 업로드 UI (최대 20장) ────────────────
const uploadZone    = document.getElementById('uploadZone');
const fileInput     = document.getElementById('fImgFile');
const previewGrid   = document.getElementById('multiPreviewGrid');
const imgCountEl    = document.getElementById('imgCount');

function updateImgCount() {
  imgCountEl.textContent = `(${pendingFiles.length} / 20)`;
  previewGrid.style.display = pendingFiles.length > 0 ? 'grid' : 'none';
}

function addFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    if (pendingFiles.length >= 20) { alert('최대 20장까지 업로드할 수 있습니다.'); break; }
    const previewUrl = URL.createObjectURL(file);
    pendingFiles.push({ file, caption: '', previewUrl });
  }
  renderMultiPreview();
}

function renderMultiPreview() {
  previewGrid.innerHTML = pendingFiles.map((item, idx) => `
    <div style="position:relative;display:flex;flex-direction:column;gap:4px">
      <div style="position:relative">
        <img src="${item.previewUrl}" alt="" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#EBEBEB" />
        <button type="button" onclick="removeImg(${idx})"
          style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.55);color:#FFF;border:none;
                 width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;
                 display:flex;align-items:center;justify-content:center;line-height:1">✕</button>
        <div style="position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.45);color:#FFF;
                    font-size:9px;padding:2px 6px;letter-spacing:1px">${idx + 1}</div>
      </div>
      <input type="text" placeholder="캡션 (선택)" value="${escHtml(item.caption)}"
        oninput="pendingFiles[${idx}].caption = this.value"
        style="border:1px solid #E2E2E2;padding:4px 8px;font-size:11px;font-family:inherit;width:100%;outline:none;background:#FAFAFA" />
    </div>
  `).join('');
  updateImgCount();
}

function removeImg(idx) {
  URL.revokeObjectURL(pendingFiles[idx].previewUrl);
  pendingFiles.splice(idx, 1);
  renderMultiPreview();
}

function clearAllPreviews() {
  pendingFiles.forEach(f => URL.revokeObjectURL(f.previewUrl));
  pendingFiles = [];
  fileInput.value = '';
  renderMultiPreview();
}

fileInput.addEventListener('change', e => {
  addFiles(e.target.files);
  fileInput.value = ''; // reset so same file can be re-added if needed
});

// 드래그 앤 드롭
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  addFiles(e.dataTransfer.files);
});

// ── WORKS CRUD ────────────────────────────────────────
async function loadWorks() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '<tr class="loading-row"><td colspan="6">불러오는 중...</td></tr>';
  const { data, error } = await db.from('works').select('*').order('category').order('sort_order');
  if (error) {
    tbody.innerHTML = '<tr class="loading-row"><td colspan="6">불러오기 실패</td></tr>';
    return;
  }
  allWorks = data || [];
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const titleEl = document.getElementById('tableTitle');
  if (titleEl) titleEl.textContent = showDeleted ? '삭제된 이력' : '전체 이력';

  let works = showDeleted
    ? allWorks.filter(w => w.deleted_at)
    : allWorks.filter(w => !w.deleted_at);
  if (filterCat !== 'all') works = works.filter(w => w.category === filterCat);

  if (!works.length) {
    const empty = showDeleted ? '삭제된 항목이 없습니다.' : '이력이 없습니다.';
    tbody.innerHTML = `<tr class="loading-row"><td colspan="6">${empty}</td></tr>`;
    return;
  }
  tbody.innerHTML = works.map(w => {
    const thumb = w.image_path
      ? `<img class="td-thumb" src="${escHtml(w.image_path)}" alt="" />`
      : `<div class="td-thumb-empty">—</div>`;
    const isDeleted = !!w.deleted_at;
    const rowStyle = isDeleted ? 'background:#FAF6F4;opacity:0.75' : '';
    const titleHtml = isDeleted
      ? `<strong style="color:#888;text-decoration:line-through">${escHtml(w.title)}</strong>
         <div style="font-size:10px;color:#CC3333;letter-spacing:1px;text-transform:uppercase;margin-top:3px">삭제됨 · ${fmtDate(w.deleted_at)}</div>`
      : `<strong>${escHtml(w.title)}</strong>`;
    const actions = isDeleted
      ? `<button class="btn ghost small" onclick="restoreWork('${w.id}')">복원</button>`
      : `<button class="btn ghost small" onclick="startEdit('${w.id}')">수정</button>
         <button class="btn danger small" onclick="deleteWork('${w.id}')">삭제</button>`;
    return `
      <tr data-id="${w.id}" style="${rowStyle}">
        <td>${thumb}</td>
        <td>${titleHtml}</td>
        <td><span class="badge">${CAT_KR[w.category] || w.category}</span></td>
        <td>${w.year || '—'}</td>
        <td style="color:#888;font-size:12px">${escHtml(w.subtitle || '—')}</td>
        <td><div class="table-actions">${actions}</div></td>
      </tr>`;
  }).join('');
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── ADD ───────────────────────────────────────────────
document.getElementById('addForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn      = document.getElementById('addBtn');
  const msg      = document.getElementById('addMsg');
  const prog     = document.getElementById('uploadProgress');
  const category = document.getElementById('fCat').value;
  btn.disabled = true;
  msg.textContent = '';
  msg.className = 'form-msg';

  // 이미지 업로드 (다중)
  let images    = [];
  let imagePath = null;

  if (pendingFiles.length > 0) {
    prog.style.display = 'block';
    try {
      for (let i = 0; i < pendingFiles.length; i++) {
        const { file, caption } = pendingFiles[i];
        msg.textContent = `이미지 업로드 중... (${i + 1} / ${pendingFiles.length})`;
        const url = await uploadToStorage(file, category);
        images.push({ url, caption: caption || '' });
      }
    } catch (err) {
      msg.textContent = '이미지 업로드 실패: ' + err.message;
      msg.className = 'form-msg err';
      btn.disabled = false;
      prog.style.display = 'none';
      return;
    }
    prog.style.display = 'none';
    imagePath = images[0].url; // 첫 번째 이미지를 대표 이미지로
  }

  const payload = {
    title:       document.getElementById('fTitle').value.trim(),
    subtitle:    document.getElementById('fSub').value.trim() || null,
    category,
    year:        document.getElementById('fYear').value ? parseInt(document.getElementById('fYear').value) : null,
    description: document.getElementById('fDesc').value.trim() || null,
    image_path:  imagePath,
    images:      images,
    link:        document.getElementById('fLink').value.trim() || null,
    sort_order:  allWorks.filter(w => w.category === category).length + 1,
  };

  msg.textContent = 'DB 저장 중...';
  const { error } = await db.from('works').insert(payload);
  btn.disabled = false;

  if (error) {
    msg.textContent = '저장 실패: ' + error.message;
    msg.className = 'form-msg err';
    return;
  }

  msg.textContent = '✓ 추가 완료!';
  msg.className = 'form-msg ok';
  document.getElementById('addForm').reset();
  clearAllPreviews();
  setTimeout(() => { msg.textContent = ''; }, 2500);
  loadWorks();
});

// ── EDIT ──────────────────────────────────────────────
let editPendingFiles = []; // edit 중 새로 추가할 파일

function addEditImages(input, id) {
  const files = Array.from(input.files);
  const w = allWorks.find(x => x.id === id);
  const existCount = (Array.isArray(w?.images) ? w.images.length : (w?.image_path ? 1 : 0)) + editPendingFiles.length;
  const remaining = 20 - existCount;
  for (const file of files.slice(0, remaining)) {
    editPendingFiles.push({ file, caption: '', previewUrl: URL.createObjectURL(file) });
  }
  if (files.length > remaining) alert(`최대 20장까지 가능합니다. ${files.length - remaining}장은 제외되었습니다.`);
  renderEditNewPreviews();
  input.value = '';
}

function renderEditNewPreviews() {
  const el = document.getElementById('eImgNewPreviews');
  if (!el) return;
  el.innerHTML = editPendingFiles.map((item, idx) => `
    <div style="position:relative;display:flex;flex-direction:column;gap:4px">
      <div style="position:relative">
        <img src="${item.previewUrl}" style="width:100%;aspect-ratio:1/1;object-fit:cover;background:#EBEBEB" />
        <button type="button" onclick="removeEditNewImg(${idx})"
          style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.55);color:#FFF;border:none;
                 width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;line-height:1">✕</button>
        <div style="position:absolute;bottom:2px;left:4px;background:rgba(0,0,0,0.45);color:#FFF;font-size:8px;padding:1px 5px">NEW</div>
      </div>
      <input type="text" placeholder="캡션" value="${escHtml(item.caption)}"
        oninput="editPendingFiles[${idx}].caption=this.value"
        style="border:1px solid #E2E2E2;padding:3px 6px;font-size:11px;font-family:inherit;width:100%;outline:none" />
    </div>
  `).join('');
}

function removeEditNewImg(idx) {
  URL.revokeObjectURL(editPendingFiles[idx].previewUrl);
  editPendingFiles.splice(idx, 1);
  renderEditNewPreviews();
}

function startEdit(id) {
  const w = allWorks.find(x => x.id === id);
  if (!w) return;
  editingId = id;
  editPendingFiles = [];

  // 기존 이미지 표시
  const existingImgs = Array.isArray(w.images) && w.images.length > 0
    ? w.images
    : (w.image_path ? [{ url: w.image_path, caption: '' }] : []);

  const existingImgHtml = existingImgs.length > 0
    ? `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px">
        ${existingImgs.map((img, i) => `
          <div style="position:relative">
            <img src="${escHtml(img.url)}" style="width:100%;aspect-ratio:1/1;object-fit:cover;background:#EBEBEB" />
            <div style="font-size:9px;color:#888;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(img.caption || '')}</div>
          </div>`).join('')}
       </div>`
    : `<div style="color:#CCC;font-size:11px;margin-bottom:6px">이미지 없음</div>`;

  const row = document.querySelector(`tr[data-id="${id}"]`);
  row.innerHTML = `
    <td colspan="5">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding:4px 0">
        <div>
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:5px">제목</div>
          <input class="edit-input" id="eTitle" value="${escHtml(w.title)}" />
        </div>
        <div>
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:5px">카테고리</div>
          <select class="edit-input" id="eCat">
            <option value="curation"          ${w.category==='curation'          ?'selected':''}>Curation</option>
            <option value="docent"            ${w.category==='docent'            ?'selected':''}>Docent</option>
            <option value="lecture"           ${w.category==='lecture'           ?'selected':''}>Lecture (기업 강연)</option>
            <option value="signature_lecture" ${w.category==='signature_lecture' ?'selected':''}>Signature Lecture</option>
            <option value="talk"              ${w.category==='talk'              ?'selected':''}>Talk</option>
          </select>
        </div>
        <div>
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:5px">연도</div>
          <input class="edit-input" id="eYear" type="number" value="${w.year||''}" />
        </div>
        <div>
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:5px">부제목</div>
          <input class="edit-input" id="eSub" value="${escHtml(w.subtitle||'')}" />
        </div>
        <div style="grid-column:1/-1">
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:5px">링크</div>
          <input class="edit-input" id="eLink" value="${escHtml(w.link||'')}" />
        </div>
        <div style="grid-column:1/-1">
          <div style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:8px">이미지 (현재 ${existingImgs.length}장)</div>
          ${existingImgHtml}
          <label class="edit-upload-btn" style="display:inline-flex;align-items:center;gap:6px;margin-top:10px">
            📎 이미지 추가 (최대 20장)
            <input type="file" class="edit-upload-input" id="eImgFile"
              accept="image/*" multiple
              onchange="addEditImages(this, '${id}')" />
          </label>
          <span style="font-size:11px;color:#B0A998;margin-left:8px" id="eImgName"></span>
          <div id="eImgNewPreviews" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px"></div>
        </div>
      </div>
    </td>
    <td>
      <div class="table-actions" style="flex-direction:column;gap:6px">
        <button class="btn small" onclick="saveEdit('${id}')">저장</button>
        <button class="btn ghost small" onclick="loadWorks()">취소</button>
      </div>
    </td>`;
  row.classList.add('edit-row');
}

async function saveEdit(id) {
  const w = allWorks.find(x => x.id === id);
  if (!w) return;

  const saveBtn = document.querySelector(`tr[data-id="${id}"] .btn:not(.ghost)`);
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }

  const category = document.getElementById('eCat').value;

  // 기존 이미지 배열
  let images = Array.isArray(w.images) && w.images.length > 0
    ? [...w.images]
    : (w.image_path ? [{ url: w.image_path, caption: '' }] : []);

  // 새 이미지 업로드
  if (editPendingFiles.length > 0) {
    try {
      for (let i = 0; i < editPendingFiles.length; i++) {
        if (images.length >= 20) break;
        const { file, caption } = editPendingFiles[i];
        const url = await uploadToStorage(file, category);
        images.push({ url, caption: caption || '' });
      }
    } catch (err) {
      alert('이미지 업로드 실패: ' + err.message);
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '저장'; }
      return;
    }
  }

  const imagePath = images.length > 0 ? images[0].url : null;

  const payload = {
    title:      document.getElementById('eTitle').value.trim(),
    category,
    year:       document.getElementById('eYear').value ? parseInt(document.getElementById('eYear').value) : null,
    subtitle:   document.getElementById('eSub').value.trim() || null,
    link:       document.getElementById('eLink').value.trim() || null,
    image_path: imagePath,
    images,
  };

  const { error } = await db.from('works').update(payload).eq('id', id);
  if (error) { alert('수정 실패: ' + error.message); return; }
  editPendingFiles = [];
  editingId = null;
  loadWorks();
}

async function deleteWork(id) {
  const w = allWorks.find(x => x.id === id);
  if (!confirm(`"${w?.title}" 을 삭제하시겠어요?\n\n데이터는 보존되며, "삭제된 항목" 탭에서 복원할 수 있습니다.`)) return;
  const { error } = await db.from('works').update({ deleted_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('삭제 실패: ' + error.message); return; }
  loadWorks();
}

async function restoreWork(id) {
  const w = allWorks.find(x => x.id === id);
  if (!confirm(`"${w?.title}" 을 복원하시겠어요?`)) return;
  const { error } = await db.from('works').update({ deleted_at: null }).eq('id', id);
  if (error) { alert('복원 실패: ' + error.message); return; }
  loadWorks();
}

// ── FILTER TABS ───────────────────────────────────────
document.querySelectorAll('.filter-btn[data-cat]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterCat = btn.dataset.cat;
    renderTable();
  });
});

// ── 삭제된 항목 토글 ──────────────────────────────────
document.getElementById('trashToggleBtn').addEventListener('click', e => {
  showDeleted = !showDeleted;
  e.currentTarget.classList.toggle('active', showDeleted);
  e.currentTarget.textContent = showDeleted ? '🗑 활성 항목 보기' : '🗑 삭제된 항목';
  renderTable();
});

// ── UTILS ─────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── INIT ──────────────────────────────────────────────
checkSession();
</script>
